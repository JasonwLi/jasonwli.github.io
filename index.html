    <!-- the two faces the first viewport sets (Castoro text, Castoro Titling name); same files the CSS references, so no double fetch -->
    <link rel="preload" href="./node_modules/@fontsource/castoro/files/castoro-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="./node_modules/@fontsource/castoro-titling/files/castoro-titling-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <!-- terrain-preload: INT fills this block (manifest + stage-A preloads); nobody else edits inside it -->
    <!-- /terrain-preload -->
    <!-- boot-shell (INT): the steel page and the engraved loading plate paint from this HTML alone,
         before any stylesheet, font or script arrives; GlobeScene fades it out on the canvas's first frame -->
    <style>
      html, body { margin: 0; background: #011844; }
      #boot-globe { position: fixed; left: 0; top: 0; z-index: 0; overflow: visible; pointer-events: none; transition: opacity 0.35s ease-out; }
      #boot-globe.is-out { opacity: 0; }
      #boot-globe .bg-disc { fill: #03224d; }
      #boot-globe .bg-grat { fill: none; stroke: #69502e; stroke-width: 1; }
      #boot-globe .bg-rim { fill: none; stroke: #69502e; stroke-width: 1; }
    </style>
    <title>Jason Li — engineer, traveler</title>
  </head>
  <body>
    <svg id="boot-globe" viewBox="-1 -1 2 2" width="0" height="0" aria-hidden="true" focusable="false">
      <circle class="bg-disc" r="1" />
      <path class="bg-grat" vector-effect="non-scaling-stroke" d="" />
      <circle class="bg-rim" r="1" vector-effect="non-scaling-stroke" />
    </svg>
    <script>
      // mirrors src/theme/choreography.ts 'hero' (desktop + phone) so the plate sits where the globe will
      ;(function () {
        var el = document.getElementById('boot-globe'), w = innerWidth, h = innerHeight, cx, cy, R
        var cl = function (v, a, b) { return Math.min(b, Math.max(a, v)) }
        if (w <= 860) {
          R = Math.min(Math.min((146 / 390) * w, w / 2 - 32), (h - 16 - 304) / 2 - 28); cx = w / 2; cy = (304 + h - 16) / 2
        } else {
          var sy = h / 900, g = cl(w * (96 / 1440), 24, 96), left = g + Math.max(436 * (cl(0.059 * w, 46, 84) / 84), 360) + 72, right = w - 48
          cy = 470 * sy
          var fit = function (r, reach) { return Math.min(r, cy - reach - 8, h - cy - reach - 8) }
          R = Math.min(fit(300 * sy, 48), (right - left) / 2 - 48); var reach = 48
          if (R < 220) { R = Math.min(fit(300 * sy, 28), (right - left) / 2 - 28); reach = 28 }
          cx = cl((960 / 1440) * w, left + R + reach, right - R - reach)
        }
        R = Math.max(24, R)
        var d = 'M0 -1V1', k
        for (k = 10; k < 90; k += 10) {
          var s = Math.sin((k * Math.PI) / 180), c = Math.cos((k * Math.PI) / 180)
          d += 'M0 -1A' + s + ' 1 0 0 0 0 1A' + s + ' 1 0 0 0 0 -1'
          d += 'M' + -c + ' ' + -s + 'H' + c + 'M' + -c + ' ' + s + 'H' + c
        }
        d += 'M-1 0H1'
        el.querySelector('.bg-grat').setAttribute('d', d)
        el.setAttribute('width', 2 * R); el.setAttribute('height', 2 * R)
        el.style.transform = 'translate(' + (cx - R) + 'px,' + (cy - R) + 'px)'
        // the static SVG fallback globe (no WebGL2) replaces the canvas: hand over to it too
        // (GlobeScene disconnects this observer when it takes over first)
        el._obs = new MutationObserver(function (_, o) {
          if (document.querySelector('.fallback-globe')) { el.classList.add('is-out'); o.disconnect() }
        })
        el._obs.observe(document.body, { childList: true, subtree: true })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
